name: Release Cloudflare Worker API

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA of the current main HEAD
        required: true
        type: string
      d1_recovery_point:
        description: Confirm the current D1 Time Travel bookmark was recorded
        required: true
        default: NOT_CONFIRMED
        type: choice
        options:
          - NOT_CONFIRMED
          - CONFIRMED_D1_BOOKMARK
      migrations_applied:
        description: Confirm reviewed D1 migrations were applied manually
        required: true
        default: NOT_CONFIRMED
        type: choice
        options:
          - NOT_CONFIRMED
          - CONFIRMED_MIGRATIONS_APPLIED

permissions:
  contents: read

concurrency:
  group: production-cloudflare-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate release authorization inputs
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          D1_ACK: ${{ inputs.d1_recovery_point }}
          MIGRATION_ACK: ${{ inputs.migrations_applied }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$D1_ACK" = "CONFIRMED_D1_BOOKMARK"
          test "$MIGRATION_ACK" = "CONFIRMED_MIGRATIONS_APPLIED"

      - name: Check out authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify revision is the immutable current main HEAD
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            weathered-mud-6ed5/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix weathered-mud-6ed5

      - name: Revalidate exact release candidate
        run: npm run release:prepush

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://weathered-mud-6ed5.joshuablaszczyk.workers.dev
    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfirm validated revision
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            weathered-mud-6ed5/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix weathered-mud-6ed5

      - name: Rebuild and retest approved revision
        run: npm run release:prepush

      - name: Confirm required Worker secret bindings already exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run check:cloudflare-worker-secrets

      - name: Confirm production D1 already matches this release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run check:cloudflare-d1

      # This workflow intentionally has no migration-apply command. GitHub
      # Pages publishes the canonical frontend separately; this deploy updates
      # only the Worker API and its noindexed preview/fallback assets.
      - name: Deploy Worker API
        working-directory: weathered-mud-6ed5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec -- wrangler deploy

      - name: Verify production Worker API contract
        env:
          API_HEALTH_URL: https://weathered-mud-6ed5.joshuablaszczyk.workers.dev/api/health
        run: npm run api:check:production

      - name: Verify GitHub Pages frontend and cross-origin Worker contract
        env:
          PRODUCTION_SITE_ORIGIN: https://fragrancecollect.com
          PRODUCTION_API_ORIGIN: https://weathered-mud-6ed5.joshuablaszczyk.workers.dev
        run: npm run check:cloudflare-production
